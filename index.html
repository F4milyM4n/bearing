<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Bearing</title>

<!-- PWA / "Add to Home Screen" behavior -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#242726">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bearing">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-32.png">

<!-- Tailwind (layout/spacing/typography utilities only — all color comes
     from Bearing's own theme system, not Tailwind's color palette) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- React (UMD builds) -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<style>
  html, body { background: #242726; margin: 0; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root">
  <noscript>Bearing requires JavaScript to run.</noscript>
</div>
<!-- ?v= changes with every release so a stale cached copy can never be reused -->
<script src="app.js?v=12"></script>
<script>
  if ('serviceWorker' in navigator) {
    // Only reload for an UPDATE (a service worker was already in control when
    // this page opened). On a first-ever visit the worker also "takes over",
    // but reloading then would just interrupt onboarding for no reason.
    const hadController = !!navigator.serviceWorker.controller;
    let refreshedOnce = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || refreshedOnce) return;
      refreshedOnce = true;
      window.location.reload();
    });

    window.addEventListener('load', () => {
      // updateViaCache:'none' => sw.js itself is never served from HTTP cache,
      // so a new release is noticed as soon as the page is opened.
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
        // An installed app often stays alive in the background for days.
        // Re-check for a new release whenever it comes back to the foreground
        // and once an hour while it is open.
        const check = () => { reg.update().catch(() => {}); };
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') check();
        });
        setInterval(check, 60 * 60 * 1000);
      }).catch(() => {});
    });
  }
</script>
</body>
</html>
